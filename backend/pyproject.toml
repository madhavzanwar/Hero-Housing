[project]
name = "finpilot-homeloan"
version = "1.0.0"
description = "FinPilot HomeLoan — explainable mortgage underwriting (Home Loan & LAP) with an agentic Underwriting Copilot"
requires-python = ">=3.12"
readme = "../README.md"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".data", "app/ml/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = [
    "UP017",   # datetime.UTC alias — keep timezone.utc for readability
    "RUF001", "RUF002", "RUF003",  # ₹, ×, — and other intentional unicode in user-facing text
    "B008",    # FastAPI File()/Form() defaults
    "SIM108",
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N802", "N803"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^\\.data/", "^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
